<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Awang Mesh Preview</title>
  <style>
    body, html, canvas { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #1a1e24; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <script type="module">
    import * as BABYLON from '/node_modules/@babylonjs/core/index.js';
    import '/node_modules/@babylonjs/loaders/OBJ/index.js';

    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.1, 0.12, 0.15, 1.0);

    const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI / 2, Math.PI / 2, 3.2, new BABYLON.Vector3(0, 0, 0), scene);
    camera.attachControl(canvas, true);

    const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
    hemi.intensity = 0.8;
    const dir = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(0.5, -1, 1), scene);
    dir.intensity = 0.7;
    const backLight = new BABYLON.DirectionalLight("back", new BABYLON.Vector3(-0.5, 0.5, -1), scene);
    backLight.intensity = 0.5;

    window.meshReady = false;

    BABYLON.SceneLoader.ImportMeshAsync("", "/assets/awang/", "awang-source.obj", scene).then((result) => {
      console.log("Loaded meshes:", result.meshes.length);
      window.meshes = result.meshes;
      window.meshReady = true;

      const mat = new BABYLON.StandardMaterial("debugMat", scene);
      mat.diffuseColor = new BABYLON.Color3(0.85, 0.82, 0.8);
      mat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
      mat.backFaceCulling = false;

      for (const m of result.meshes) {
        m.material = mat;
      }
    }).catch(err => {
      console.error("Load error:", err);
      window.loadError = err.message;
    });

    engine.runRenderLoop(() => {
      scene.render();
    });

    window.setCameraView = (view) => {
      if (view === 'front') {
        camera.alpha = Math.PI / 2; // looking at character front (-Z)
        camera.beta = Math.PI / 2;
        camera.target = new BABYLON.Vector3(0, 0, 0);
        camera.radius = 3.2;
      } else if (view === 'back') {
        camera.alpha = -Math.PI / 2;
        camera.beta = Math.PI / 2;
        camera.target = new BABYLON.Vector3(0, 0, 0);
        camera.radius = 3.2;
      } else if (view === 'side') {
        camera.alpha = 0;
        camera.beta = Math.PI / 2;
        camera.target = new BABYLON.Vector3(0, 0, 0);
        camera.radius = 3.2;
      } else if (view === 'face') {
        camera.alpha = Math.PI / 2;
        camera.beta = Math.PI / 2;
        camera.target = new BABYLON.Vector3(0, 0.72, 0);
        camera.radius = 0.75;
      }
    };
  </script>
</body>
</html>
