name: Build macOS Demo

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/build-macos-demo.yml'

jobs:
  build-macos-demo:
    name: Build Universal macOS DMG
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust targets
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Tauri macOS Universal Demo
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Stage DMG Artifact
        run: |
          mkdir -p release-artifacts
          DMG_FILE=$(find src-tauri/target -name "*.dmg" | head -n 1)
          if [ -z "$DMG_FILE" ]; then
            echo "::error::No DMG file found in src-tauri/target"
            exit 1
          fi
          echo "Found DMG at: $DMG_FILE"
          cp "$DMG_FILE" release-artifacts/Catchup-Demo.dmg
          ls -la release-artifacts/

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Catchup-Demo-macOS
          path: release-artifacts/Catchup-Demo.dmg
          if-no-files-found: error
